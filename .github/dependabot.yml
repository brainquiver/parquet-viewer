# Dependabot opens a pull request for each update, and a person merges it. Nothing merges
# automatically. A security update comes as soon as GitHub knows of the advisory, whatever
# the schedule below says.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    # Gives build(deps-dev): subjects, as the commit spec asks for. Vitest and hyparquet-writer,
    # which writes the test files, are the only packages.
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    # The minor and patch updates in one pull request. A major update comes alone, because it
    # can break the API.
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Europe/London
    # Dependabot moves the commit hash of a pinned action and the version comment beside it.
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
