name: Tests

# The unit tests. They need no account, so they run on every pull request, from a fork too, and
# on each push to main. A push to another branch waits for its pull request, because a branch
# here with a pull request would otherwise run twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Node ${{ matrix.node }})
    # Blacksmith for pushes to main and for pull requests. A Dependabot pull request stays on
    # GitHub, on the Ubuntu 24.04 of the Blacksmith runner, because a routine update gains
    # nothing from a faster runner. The test reads who opened the pull request, so a manual
    # re-run of its checks stays on GitHub too.
    runs-on: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The Node.js releases in long-term support. Vitest needs 22.12 or later.
        node: [22, 24]
    steps:
      # Pinned to a commit, because a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # One test also runs tools/build-test-page.py, with the Python 3 of the runner.
      - run: npm test
